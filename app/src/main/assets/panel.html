<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FONEX PANEL</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body { margin: 0; padding: 14px; background: #0c0e16; color: #eef1f8; }
    .card { background: #151926; border: 1px solid #242b40; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: #101420; border: 1px solid #20273b; border-radius: 10px; padding: 10px; text-align: center; }
    .stat .num { font-size: 18px; font-weight: bold; }
    .stat .lbl { font-size: 12px; color: #9aa4bf; margin-top: 4px; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    label { display: block; font-size: 12px; color: #b5bfd9; margin: 8px 0 4px; }
    input, select, textarea {
      width: 100%; background: #0d1018; color: #fff; border: 1px solid #2a334d;
      border-radius: 10px; padding: 9px 11px; font-size: 13px;
    }
    textarea { min-height: 72px; resize: vertical; }
    button {
      border: 0; border-radius: 10px; padding: 9px 13px; font-size: 13px;
      cursor: pointer; color: #fff; background: #5b46f6; font-weight: bold;
    }
    button.sec { background: #232a3e; color: #dce3f7; }
    button.ok { background: #199c68; }
    button.warn { background: #c93b4b; }
    button.active { outline: 2px solid #9586ff; background: #6d58ff; }
    .pill { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; background: #20283d; color: #cbd5f0; }
    .task-item { background: #101420; border: 1px solid #222a3f; border-radius: 10px; padding: 10px; margin-top: 8px; font-size: 12px; line-height: 1.7; }
    .muted { color: #96a0ba; font-size: 12px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; background: #e0a100; }
    .dot.online { background: #1ec97e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <div>
        <div style="font-weight:bold; font-size:16px;">FONEX PANEL</div>
        <div id="connText" class="muted"><span class="dot"></span>در حال اتصال به سرور...</div>
      </div>
      <div id="sysStats" class="muted">RAM: - | CPU: -</div>
    </div>
  </div>

  <div class="grid-3 card" style="padding:10px;">
    <div class="stat"><div id="stRunning" class="num">0</div><div class="lbl">در حال اجرا (حداکثر ۳)</div></div>
    <div class="stat"><div id="stDone" class="num">0</div><div class="lbl">موفق / انجام‌شده</div></div>
    <div class="stat"><div id="stRecovered" class="num">0</div><div class="lbl">خطای بازیابی‌شده</div></div>
  </div>

  <div class="card">
    <h3>مدیریت اکانت‌ها (حداکثر ۲ اکانت)</h3>
    <div class="muted" style="margin-bottom:8px;">اکانت فعال: <b id="activeAccLabel">هیچ‌کدام</b></div>
    <div class="row">
      <input id="phoneInput" type="text" placeholder="+98912..." style="flex:1; min-width:160px;" />
      <button onclick="sendCode()">ارسال کد</button>
    </div>
    <div id="codeBox" class="row" style="margin-top:8px; display:none;">
      <input id="codeInput" type="text" placeholder="کد تایید" style="flex:1; min-width:140px;" />
      <button class="ok" onclick="verifyCode()">تایید اکانت</button>
    </div>
    <div id="accList" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <h3>ساخت تسک جدید (حداکثر ۳ تسک هم‌زمان)</h3>
    <div class="row" style="margin-bottom:8px;">
      <button id="tabSpam" class="active" onclick="setMode('spam')">اسپم</button>
      <button id="tabForward" class="sec" onclick="setMode('forward')">فوروارد</button>
    </div>

    <label>اکانت اجراکننده</label>
    <select id="taskAcc"></select>

    <label>شناسه یا لینک چت مقصد</label>
    <input id="targetChat" type="text" placeholder="مقصد اسپم یا فوروارد" />

    <div id="spamFields">
      <label>متن‌های اسپم (هر خط یک متن)</label>
      <textarea id="spamTexts" placeholder="متن اول&#10;متن دوم"></textarea>
    </div>

    <div id="forwardFields" style="display:none;">
      <label>چت مبدا و شناسه پیام</label>
      <div class="row">
        <input id="fwdSourceChat" type="text" placeholder="چت مبدا" style="flex:1; min-width:140px;" />
        <input id="fwdMsgId" type="text" placeholder="شناسه پیام" style="flex:1; min-width:120px;" />
      </div>
    </div>

    <div class="row" style="margin-top:8px;">
      <div style="flex:1; min-width:130px;">
        <label>تاخیر (ms)</label>
        <input id="delayMs" type="number" value="800" min="100" />
      </div>
      <div style="flex:1; min-width:130px;">
        <label>تعداد ارسال (0 = نامحدود)</label>
        <input id="maxCount" type="number" value="10" min="0" />
      </div>
    </div>

    <div style="margin-top:12px;">
      <button id="createTaskBtn" class="ok" style="width:100%;" onclick="createTask()">شروع تسک</button>
    </div>
    <div id="formMsg" class="muted" style="margin-top:8px;"></div>
  </div>

  <div class="card">
    <h3>تسک‌ها و حافظه بازیابی خطا</h3>
    <div id="tasksList" class="muted">در حال دریافت وضعیت...</div>
  </div>

  <script>
    let mode = 'spam';
    let state = { accounts: [], active_account: null, tasks: [], stats: {} };

    function setMode(m) {
      mode = m;
      document.getElementById('tabSpam').className = m === 'spam' ? 'active' : 'sec';
      document.getElementById('tabForward').className = m === 'forward' ? 'active' : 'sec';
      document.getElementById('spamFields').style.display = m === 'spam' ? 'block' : 'none';
      document.getElementById('forwardFields').style.display = m === 'forward' ? 'block' : 'none';
    }

    async function api(path, method = 'GET', body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    function render() {
      const accs = Array.isArray(state.accounts) ? state.accounts.slice(0, 2) : [];
      const tasks = Array.isArray(state.tasks) ? state.tasks : [];
      const runningCount = tasks.filter(t => t.status === 'running' || t.status === 'recovering').length;

      document.getElementById('stRunning').innerText = runningCount;
      document.getElementById('stDone').innerText = state.stats?.done ?? 0;
      document.getElementById('stRecovered').innerText = state.stats?.recovered ?? 0;

      if (state.stats?.ram !== undefined || state.stats?.cpu !== undefined) {
        document.getElementById('sysStats').innerText =
          `RAM: ${state.stats.ram ?? '-'}% | CPU: ${state.stats.cpu ?? '-'}%`;
      }

      const active = accs.find(a => a.key === state.active_account) || accs[0] || null;
      document.getElementById('activeAccLabel').innerText = active ? (active.phone || active.label || active.key) : 'هیچ‌کدام';

      const accListEl = document.getElementById('accList');
      if (!accs.length) {
        accListEl.innerHTML = '<div class="muted">اکانتی ثبت نشده است (سقف: ۲ اکانت).</div>';
      } else {
        accListEl.innerHTML = accs.map(a => {
          const isAct = active && a.key === active.key;
          return `<div class="row" style="justify-content:space-between; margin-top:6px; background:#101420; padding:8px; border-radius:8px;">
            <div><b>${a.phone || a.label || a.key}</b> <span class="pill">${isAct ? 'فعال' : 'آماده'}</span></div>
            <div class="row">
              ${!isAct ? `<button class="sec" onclick="switchAcc('${a.key}')">سوئیچ</button>` : ''}
              <button class="warn" onclick="removeAcc('${a.key}')">حذف</button>
            </div>
          </div>`;
        }).join('');
      }

      const sel = document.getElementById('taskAcc');
      sel.innerHTML = accs.length
        ? accs.map(a => `<option value="${a.key}" ${active && a.key === active.key ? 'selected' : ''}>${a.phone || a.label || a.key}</option>`).join('')
        : '<option value="">ابتدا یک اکانت ثبت کنید</option>';

      const createBtn = document.getElementById('createTaskBtn');
      createBtn.disabled = runningCount >= 3;
      createBtn.innerText = runningCount >= 3 ? 'حداکثر ۳ تسک هم‌زمان فعال است' : 'شروع تسک';

      const tasksEl = document.getElementById('tasksList');
      if (!tasks.length) {
        tasksEl.innerHTML = '<div class="muted">تسکی ثبت نشده است.</div>';
      } else {
        tasksEl.innerHTML = tasks.map(t => `
          <div class="task-item">
            <div class="row" style="justify-content:space-between;">
              <div><b>${(t.mode || 'spam').toUpperCase()}</b> <span class="pill">${t.status || 'idle'}</span></div>
              <div class="row">
                ${(t.status === 'running' || t.status === 'recovering')
                  ? `<button class="warn" onclick="stopTask('${t.id}')">توقف</button>`
                  : `<button class="ok" onclick="resumeTask('${t.id}')">ادامه</button>`}
                <button class="sec" onclick="deleteTask('${t.id}')">حذف</button>
              </div>
            </div>
            <div>اکانت: <b>${t.account_key || '-'}</b> | مقصد: <b>${t.target_chat || '-'}</b> | انجام‌شده: <b>${t.sent_count ?? 0}</b></div>
            <div class="muted">آخرین دستور: ${t.last_action || '-'} | وضعیت بازیابی: ${t.recovery_info || 'پایدار'}</div>
          </div>
        `).join('');
      }
    }

    async function refreshState() {
      try {
        const data = await api('/api/state');
        state = { ...state, ...data };
        document.getElementById('connText').innerHTML = '<span class="dot online"></span>متصل به سرور (حافظه فعال)';
        render();
      } catch (e) {
        document.getElementById('connText').innerHTML = '<span class="dot"></span>در حال تلاش مجدد برای اتصال...';
      }
    }

    async function sendCode() {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone) return;
      try {
        await api('/api/auth/send_code', 'POST', { phone });
        document.getElementById('codeBox').style.display = 'flex';
      } catch (e) { alert('خطا در ارسال کد: ' + e.message); }
    }

    async function verifyCode() {
      const phone = document.getElementById('phoneInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      if (!phone || !code) return;
      try {
        await api('/api/auth/verify', 'POST', { phone, code, max_accounts: 2 });
        document.getElementById('codeInput').value = '';
        document.getElementById('codeBox').style.display = 'none';
        await refreshState();
      } catch (e) { alert('خطا در تایید کد: ' + e.message); }
    }

    async function switchAcc(key) { await api('/api/accounts/switch', 'POST', { key }); await refreshState(); }
    async function removeAcc(key) { await api('/api/accounts/remove', 'POST', { key }); await refreshState(); }

    async function createTask() {
      const msgEl = document.getElementById('formMsg');
      const account_key = document.getElementById('taskAcc').value;
      const target_chat = document.getElementById('targetChat').value.trim();
      const delay_ms = Number(document.getElementById('delayMs').value || 800);
      const max_count = Number(document.getElementById('maxCount').value || 0);
      if (!account_key || !target_chat) { msgEl.innerText = 'اکانت و مقصد را وارد کنید.'; return; }

      const payload = { mode, account_key, target_chat, delay_ms, max_count, max_concurrent: 3 };
      if (mode === 'spam') {
        const texts = document.getElementById('spamTexts').value.split('\n').map(s => s.trim()).filter(Boolean);
        if (!texts.length) { msgEl.innerText = 'حداقل یک متن اسپم وارد کنید.'; return; }
        payload.texts = texts;
      } else {
        payload.source_chat = document.getElementById('fwdSourceChat').value.trim();
        payload.message_id = document.getElementById('fwdMsgId').value.trim();
        if (!payload.source_chat || !payload.message_id) { msgEl.innerText = 'چت مبدا و شناسه پیام را وارد کنید.'; return; }
      }

      try {
        await api('/api/tasks/create', 'POST', payload);
        msgEl.innerText = 'تسک ثبت و اجرا شد.';
        await refreshState();
      } catch (e) { msgEl.innerText = 'خطا در ساخت تسک: ' + e.message; }
    }

    async function stopTask(id) { await api('/api/tasks/stop', 'POST', { id }); await refreshState(); }
    async function resumeTask(id) { await api('/api/tasks/resume', 'POST', { id }); await refreshState(); }
    async function deleteTask(id) { await api('/api/tasks/delete', 'POST', { id }); await refreshState(); }

    refreshState();
    setInterval(refreshState, 3000);
  </script>
</body>
</html>
